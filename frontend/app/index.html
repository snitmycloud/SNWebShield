<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Set the theme before the page paints (no flash): the saved choice, else the system setting. */
      (function () {
        var theme = null;
        try { theme = window.localStorage.getItem("snwebshield-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101c33" />
    <meta name="description" content="SNwebshield: monitors, detects, identifies and reports the security of your websites." />
    <title>SNwebshield | Website security</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
